projects:
  - name: Tommys Testprojekt
    environments:
      - name: Production
        services:
          - type: web
            name: music-video-api
            runtime: node
            plan: starter
            region: frankfurt
            buildCommand: npm install --include=dev && npm run build -w @music-video/shared && npm run build -w @music-video/ai && npm run build -w @music-video/api
            startCommand: npm run start -w @music-video/api
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: APP_URL
                value: https://music-video-web.onrender.com
              - key: API_URL
                value: https://music-video-api.onrender.com
              - key: APP_ACCESS_CODE
                sync: false
              - key: SESSION_SECRET
                generateValue: true
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_TEXT_MODEL
                value: gpt-4.1
              - key: OPENAI_IMAGE_MODEL
                value: gpt-image-1-mini
              - key: OPENAI_IMAGE_QUALITY
                value: low
              - key: OPENAI_IMAGE_SIZE
                value: 1536x1024
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_SERVICE_ROLE_KEY
                sync: false
              - key: SUPABASE_STORAGE_BUCKET
                value: music-video-assets
              - key: MAX_AUDIO_MB
                value: "50"
              - key: IMAGE_GENERATION_CONCURRENCY
                value: "6"
              - key: AI_RATE_LIMIT_PER_MINUTE
                value: "80"

          - type: worker
            name: music-video-worker
            runtime: node
            plan: starter
            region: frankfurt
            buildCommand: npm install --include=dev && npm run build -w @music-video/shared && npm run build -w @music-video/ai && npm run build -w @music-video/video && npm run build -w @music-video/worker
            startCommand: npm run start -w @music-video/worker
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_OPTIONS
                value: --max-old-space-size=460
              - key: SESSION_SECRET
                fromService:
                  name: music-video-api
                  type: web
                  envVarKey: SESSION_SECRET
              - key: OPENAI_API_KEY
                sync: false
              - key: OPENAI_IMAGE_MODEL
                value: gpt-image-1-mini
              - key: OPENAI_IMAGE_QUALITY
                value: low
              - key: OPENAI_IMAGE_SIZE
                value: 1536x1024
              - key: IMAGE_GENERATION_CONCURRENCY
                value: "3"
              - key: SUPABASE_URL
                fromService:
                  name: music-video-api
                  type: web
                  envVarKey: SUPABASE_URL
              - key: SUPABASE_SERVICE_ROLE_KEY
                fromService:
                  name: music-video-api
                  type: web
                  envVarKey: SUPABASE_SERVICE_ROLE_KEY
              - key: SUPABASE_STORAGE_BUCKET
                value: music-video-assets
              - key: API_URL
                fromService:
                  name: music-video-api
                  type: web
                  envVarKey: API_URL

          - type: web
            name: music-video-web
            runtime: static
            buildCommand: npm install --include=dev && npm run build -w @music-video/web
            staticPublishPath: apps/web/dist
            routes:
              - type: rewrite
                source: /*
                destination: /index.html
            envVars:
              - key: VITE_API_URL
                value: https://music-video-api.onrender.com
              - key: NODE_VERSION
                value: "22"
